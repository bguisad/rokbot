# 推送 vYYYY.MM.DD(.N) 标签时生成 GitHub Release。
#
# 附件只有 RokBot 自己的补丁内容（补丁器与配方源码包、各平台 *.patch.json 清单、SHA256SUMS.txt），
# 由 scripts/release/gh-release.mjs 生成和上传。CI 会尝试用官方原版重新打补丁，只为得到 *.patch.json；
# 打完补丁的完整安装包含上游 Grok Bot 闭源二进制，绝不离开 runner，也不会作为附件上传。
# 某个平台构建失败不影响发布，Release 仍会附上源码包和其余平台的清单。
#
# 推送到 main（只在补丁器 / 发布脚本 / 更新说明变动时）或手动 workflow_dispatch 时，跑同样的打补丁与
# 发布流程做校验，但 Release 步骤只以 --dry-run 演练最近的 v20* 标签，不创建、不修改任何 Release 或附件。
#
# 标签触发的 Release 以「标签里的更新说明」为准（带「第N版」的说明在该标签的提交里）。
# 如需人工整理正文或补齐附件后再发布，可设置仓库变量 ROKBOT_CI_RELEASE=0：CI 仍会校验各平台 patch.json，
# 但不再创建或修改 Release，由本地 scripts/release/gh-release.mjs 负责发布。CI 用 --app-version（默认
# ROKBOT_DESKTOP_APP_VERSION）重打补丁生成的清单版本号与该标签实际发布的版本号不一致，直接上传会覆盖
# 真实清单，所以默认关闭上传。
#
# 可选仓库变量 ROKBOT_CI_RELEASE：设为 0 时标签触发的 CI 不碰 Release（默认 1）。
#
# 可选仓库变量 ROKBOT_DESKTOP_APP_VERSION：桌面端对外版本号（传给各补丁器的 --app-version）。
name: Release

on:
  push:
    tags:
      - 'v20*'
    branches:
      - main
    paths:
      - 'windows/patchers/**'
      - 'mac/patchers/**'
      - 'mac/clients/**'
      - 'linux/patchers/**'
      - 'scripts/release/**'
      - 'docs/releases/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  manifests:
    name: patch.json (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            patch: node linux/patchers/desktop/patch.mjs --arch x64 --output "$OUT"
          - name: linux-arm64
            os: ubuntu-latest
            patch: node linux/patchers/desktop/patch.mjs --arch arm64 --output "$OUT"
          - name: windows
            os: windows-latest
            patch: node windows/patchers/desktop/patch.mjs --no-installer --output "$OUT"
          - name: mac
            os: macos-latest
            patch: node mac/patchers/desktop/patch.mjs --output "$OUT/RokBot.app" --backup "$RUNNER_TEMP/backup/RokBot.app"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 用官方原版打补丁（仅为生成 patch.json）
        shell: bash
        env:
          APP_VERSION: ${{ vars.ROKBOT_DESKTOP_APP_VERSION }}
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          extra=()
          if [ -n "${APP_VERSION:-}" ]; then extra+=(--app-version "$APP_VERSION"); fi
          ${{ matrix.patch }} ${extra[@]+"${extra[@]}"}
      - name: 只收集 patch.json
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const [from, to] = process.argv.slice(1);
            fs.mkdirSync(to, { recursive: true });
            const found = fs.readdirSync(from).filter((n) => n.endsWith(".patch.json"));
            for (const n of found) { fs.copyFileSync(path.join(from, n), path.join(to, n)); console.log(n); }
            if (!found.length) { console.error("没有生成 patch.json"); process.exit(1); }
          ' "$RUNNER_TEMP/out" "$RUNNER_TEMP/manifests"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: patch-json-${{ matrix.name }}
          path: ${{ runner.temp }}/manifests/*.patch.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: manifests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test scripts/release/gh-release.test.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: patch-json-*
          path: ${{ runner.temp }}/manifests
          merge-multiple: true
      - name: 创建或更新 Release
        if: ${{ github.ref_type == 'tag' && vars.ROKBOT_CI_RELEASE != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manifests"
          node scripts/release/gh-release.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/manifests" \
            --manifests-only --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/release"
      - name: 演练最近一次 Release（不上传）
        if: ${{ github.ref_type != 'tag' || vars.ROKBOT_CI_RELEASE == '0' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manifests"
          tag="$(git describe --tags --abbrev=0 --match 'v20*')"
          echo "演练标签：$tag"
          node scripts/release/gh-release.mjs "$tag" "$RUNNER_TEMP/manifests" \
            --manifests-only --dry-run --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/release"
      - name: 每个平台都要生成 patch.json
        if: ${{ github.ref_type != 'tag' }}
        run: |
          set -euo pipefail
          n="$(find "$RUNNER_TEMP/manifests" -name '*.patch.json' | wc -l)"
          echo "patch.json 数量：$n"
          find "$RUNNER_TEMP/manifests" -name '*.patch.json'
          test "$n" -ge 4
