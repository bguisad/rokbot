<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>RokBot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/rokbot-icon.png" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/components.css" />
    <link rel="stylesheet" href="/shell.css" />
    <link rel="stylesheet" href="/pages.css" />
    <link rel="stylesheet" href="/stage.css" />
    <link rel="stylesheet" href="/usage-charts.css" />
    <link rel="stylesheet" href="/migrate-wizard.css" />
    <link rel="stylesheet" href="/usage-dashboard.css" />
    <script src="/theme.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="loading" class="loading" role="status">正在连接 Host…</div>
    <div id="auth-screen" class="auth theme-dark" hidden>
      <header class="auth-top">
        <span class="brand"><svg class="brand-mark" viewBox="0 0 1024 1024" aria-hidden="true"><defs><linearGradient id="rokbot-tile-auth" x1="287.55" y1="-104.66" x2="736.45" y2="1128.66" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4fbfe"/><stop offset="1" stop-color="#c9eef7"/></linearGradient><linearGradient id="rokbot-chassis-auth" x1="512" y1="56" x2="512" y2="960" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#242936"/><stop offset="1" stop-color="#12141b"/></linearGradient></defs><rect class="brand-tile" width="1024" height="1024" rx="308" fill="url(#rokbot-tile-auth)"/><rect class="brand-tile-rim" x="12" y="12" width="1000" height="1000" rx="296"/><rect class="brand-tile-edge" x="2" y="2" width="1020" height="1020" rx="306"/><g transform="translate(512 512) scale(0.84) translate(-512 -506)"><path class="brand-face" fill="url(#rokbot-chassis-auth)" d="M 340 148 C 408 148 476 144 540 144 C 618 144 664 60 756 56 C 836 52 892 104 884 176 C 878 214 932 272 956 368 C 964 464 960 564 948 656 C 928 816 820 924 636 944 C 532 956 424 960 324 952 C 156 938 76 836 68 668 C 62 548 64 424 72 336 C 84 200 184 148 340 148 Z"/><rect class="brand-eye" x="304" y="396" width="144" height="336" rx="72" transform="rotate(-26 376 564)"/><rect class="brand-eye" x="576" y="370" width="144" height="268" rx="72" transform="rotate(-26 648 504)"/><circle class="brand-accent" cx="768" cy="144" r="42"/></g></svg><span>RokBot <small>Host</small></span></span>
      </header>
      <form id="auth-form" class="auth-talk">
        <h1 id="auth-title" class="sr-only">登录 Host</h1>
        <p id="auth-error" class="auth-bubble" role="alert" hidden></p>
        <label id="setup-key-label" class="composer" hidden><span class="sr-only">初始化密钥</span><input id="setup-key" name="setupKey" autocomplete="off" spellcheck="false" placeholder="初始化密钥" /></label>
        <div class="composer">
          <label class="sr-only" for="auth-password">管理员密码</label>
          <input id="auth-password" type="password" name="password" autocomplete="current-password" minlength="8" maxlength="128" required placeholder="管理员密码" />
          <button id="auth-submit" class="send-btn icon-btn" type="submit" aria-label="登录"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </div>
      </form>
      <div id="auth-face" class="auth-horizon"></div>
    </div>
    <div id="console" class="shell" hidden>
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <a class="brand" href="/" data-view="overview"><svg class="brand-mark" viewBox="0 0 1024 1024" aria-hidden="true"><defs><linearGradient id="rokbot-tile-nav" x1="287.55" y1="-104.66" x2="736.45" y2="1128.66" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4fbfe"/><stop offset="1" stop-color="#c9eef7"/></linearGradient><linearGradient id="rokbot-chassis-nav" x1="512" y1="56" x2="512" y2="960" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#242936"/><stop offset="1" stop-color="#12141b"/></linearGradient></defs><rect class="brand-tile" width="1024" height="1024" rx="308" fill="url(#rokbot-tile-nav)"/><rect class="brand-tile-rim" x="12" y="12" width="1000" height="1000" rx="296"/><rect class="brand-tile-edge" x="2" y="2" width="1020" height="1020" rx="306"/><g transform="translate(512 512) scale(0.84) translate(-512 -506)"><path class="brand-face" fill="url(#rokbot-chassis-nav)" d="M 340 148 C 408 148 476 144 540 144 C 618 144 664 60 756 56 C 836 52 892 104 884 176 C 878 214 932 272 956 368 C 964 464 960 564 948 656 C 928 816 820 924 636 944 C 532 956 424 960 324 952 C 156 938 76 836 68 668 C 62 548 64 424 72 336 C 84 200 184 148 340 148 Z"/><rect class="brand-eye" x="304" y="396" width="144" height="336" rx="72" transform="rotate(-26 376 564)"/><rect class="brand-eye" x="576" y="370" width="144" height="268" rx="72" transform="rotate(-26 648 504)"/><circle class="brand-accent" cx="768" cy="144" r="42"/></g></svg><span>RokBot <small>Host</small></span></a>
          <button id="nav-toggle" class="icon-btn nav-toggle" type="button" aria-label="菜单" aria-expanded="false"></button>
        </div>
        <nav id="nav" class="nav" aria-label="管理导航"></nav>
        <div class="sidebar-foot">
          <button id="account" class="nav-item account" type="button" data-view="general">
            <span id="account-avatar" class="avatar" data-private></span>
            <span class="account-copy"><strong id="account-name" data-private></strong><span id="header-health" class="status" role="status">正在检查</span></span>
          </button>
          <button id="privacy-toggle" class="icon-btn" type="button" aria-label="隐藏敏感信息"></button>
        </div>
      </aside>
      <main id="main" class="main">
        <section data-panel="overview" class="page overview"></section>
        <section data-panel="general" class="page" hidden></section>
        <section data-panel="model" class="page" hidden></section>
        <section data-panel="speech" class="page" hidden></section>
        <section data-panel="media" class="page" hidden></section>
        <section data-panel="web-services" class="page" hidden></section>
        <section data-panel="harness" class="page" hidden></section>
        <section data-panel="skills" class="page" hidden></section>
        <section data-panel="apps" class="page" hidden></section>
        <section data-panel="prompts" class="page wide" hidden></section>
        <section data-panel="devices" class="page" hidden></section>
        <section data-panel="web-client" class="page" hidden></section>
        <section data-panel="updates" class="page" hidden></section>
        <section data-panel="network" class="page" hidden></section>
        <section data-panel="execution" class="page" hidden></section>
        <section data-panel="federation" class="page" hidden></section>
        <section data-panel="webhooks" class="page" hidden></section>
        <section data-panel="sharing" class="page" hidden></section>
        <section data-panel="migrate" class="page" hidden></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
