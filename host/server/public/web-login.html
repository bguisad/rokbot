<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0e0e0e" />
    <title>RokBot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/rokbot-icon.png" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/components.css" />
    <link rel="stylesheet" href="/shell.css" />
    <link rel="stylesheet" href="/stage.css" />
    <link rel="stylesheet" href="/web-login.css" />
    <script src="/theme.js"></script>
    <script type="module" src="/web-login.js"></script>
  </head>
  <body>
    <div id="web-login" class="auth theme-dark">
      <header class="auth-top">
        <span class="brand"><svg class="brand-mark" viewBox="0 0 1024 1024" aria-hidden="true"><defs><linearGradient id="rokbot-tile-login" x1="287.55" y1="-104.66" x2="736.45" y2="1128.66" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4fbfe"/><stop offset="1" stop-color="#c9eef7"/></linearGradient><linearGradient id="rokbot-chassis-login" x1="512" y1="56" x2="512" y2="960" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#242936"/><stop offset="1" stop-color="#12141b"/></linearGradient></defs><rect class="brand-tile" width="1024" height="1024" rx="308" fill="url(#rokbot-tile-login)"/><rect class="brand-tile-rim" x="12" y="12" width="1000" height="1000" rx="296"/><rect class="brand-tile-edge" x="2" y="2" width="1020" height="1020" rx="306"/><g transform="translate(512 512) scale(0.84) translate(-512 -506)"><path class="brand-face" fill="url(#rokbot-chassis-login)" d="M 340 148 C 408 148 476 144 540 144 C 618 144 664 60 756 56 C 836 52 892 104 884 176 C 878 214 932 272 956 368 C 964 464 960 564 948 656 C 928 816 820 924 636 944 C 532 956 424 960 324 952 C 156 938 76 836 68 668 C 62 548 64 424 72 336 C 84 200 184 148 340 148 Z"/><rect class="brand-eye" x="304" y="396" width="144" height="336" rx="72" transform="rotate(-26 376 564)"/><rect class="brand-eye" x="576" y="370" width="144" height="268" rx="72" transform="rotate(-26 648 504)"/><circle class="brand-accent" cx="768" cy="144" r="42"/></g></svg><span>RokBot <small>网页版</small></span></span>
      </header>
      <main class="auth-talk web-talk">
        <h1 id="web-title">登录网页版</h1>
        <p id="web-lead" class="web-lead">在 Host 管理页「设备与通知」创建 6 位配对码，输入后即可在这个浏览器里使用你的 Bot。</p>
        <form id="web-form" class="web-form" hidden>
          <p id="web-message" class="auth-bubble" role="alert" hidden></p>
          <div class="composer">
            <label class="sr-only" for="web-code">配对码</label>
            <input id="web-code" name="code" inputmode="text" autocapitalize="characters" autocomplete="one-time-code" autocorrect="off" spellcheck="false" maxlength="12" required placeholder="6 位配对码" />
            <button id="web-submit" class="send-btn icon-btn" type="submit" aria-label="登录"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          </div>
        </form>
        <section id="web-paired" class="web-paired" hidden>
          <p id="web-device" class="web-device"></p>
          <div class="web-actions"><button id="web-logout" class="btn" type="button">退出登录</button><a id="web-open" class="btn btn-primary" href="/web/">进入网页版</a></div>
        </section>
        <p id="web-status" class="web-note" role="status" hidden></p>
        <p id="web-insecure" class="web-note" hidden>这个地址没有加密（http）。网页版可以用，但语音输入、麦克风和浏览器通知需要 https 地址；在公网使用时请配置 https。</p>
      </main>
      <div id="web-face" class="auth-horizon"></div>
    </div>
  </body>
</html>
