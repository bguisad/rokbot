<!doctype html>
<html lang="zh-CN" data-lang="zh" data-page="404">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · RokBot</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F8FAFC">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<script src="/theme.js?v=2"></script>
<link rel="stylesheet" href="/style.css?v=2">
<script src="/lang.js?v=2" defer></script>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">
      <img src="/img/icon.png" width="28" height="28" alt="">
      <span class="brand-name">RokBot</span>
    </a>
    <div class="header-actions">
      <div class="theme-seg" id="themeSeg" role="radiogroup" aria-label="外观 Appearance">
        <button type="button" role="radio" data-theme-pref="system" aria-checked="true" title="跟随系统 · System">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" class="svg-fill"/></svg>
        </button>
        <button type="button" role="radio" data-theme-pref="light" aria-checked="false" title="浅色 · Light">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>
        </button>
        <button type="button" role="radio" data-theme-pref="dark" aria-checked="false" title="深色 · Dark">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 10.1A5.6 5.6 0 0 1 5.9 2.8a5.6 5.6 0 1 0 7.3 7.3z"/></svg>
        </button>
      </div>
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language">
        <span lang="zh">EN</span><span lang="en">中文</span>
      </button>
    </div>
  </div>
</header>
<main class="page-404">
  <div class="container">
    <div class="card-404">
      <p class="kicker-pill"><i class="pulse-dot" aria-hidden="true"></i><span class="mono">HTTP 404</span></p>
      <h1><span lang="zh">找不到这个页面。</span><span lang="en">Page not found.</span></h1>
      <p class="lead">
        <span lang="zh">请求的页面不存在，或者链接已变更。</span>
        <span lang="en">The page you requested does not exist or has moved.</span>
      </p>
      <div class="hero-ctas">
        <a class="btn-primary-panel" href="/">
          <span class="btn-panel-main"><span lang="zh">← 回到 RokBot 首页</span><span lang="en">← Back to RokBot Home</span></span>
          <i class="btn-led" aria-hidden="true"></i>
        </a>
        <a class="btn-outline" href="https://github.com/hongfaqiu/rokbot" rel="noopener">GitHub ↗</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
