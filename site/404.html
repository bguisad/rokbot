<!doctype html>
<html lang="zh-CN" data-lang="zh" data-page="404">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · RokBot</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F8FAFC">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<script src="/theme.js?v=3"></script>
<link rel="stylesheet" href="/style.css?v=3">
<script src="/lang.js?v=3" defer></script>
</head>
<body>
<svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 18a6 6 0 0 0 0-12v12z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
  <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></symbol>
</svg>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">
      <img src="/img/icon.png" width="28" height="28" alt="">
      <span class="brand-name">RokBot</span>
    </a>
    <div class="header-actions">
      <div class="theme-seg" id="themeSeg" role="radiogroup" aria-label="外观 Appearance">
        <button type="button" role="radio" data-theme-pref="system" aria-checked="true" title="跟随系统 · System">
          <svg class="ico ico-15" aria-hidden="true"><use href="#i-contrast"></use></svg>
        </button>
        <button type="button" role="radio" data-theme-pref="light" aria-checked="false" title="浅色 · Light">
          <svg class="ico ico-15" aria-hidden="true"><use href="#i-sun"></use></svg>
        </button>
        <button type="button" role="radio" data-theme-pref="dark" aria-checked="false" title="深色 · Dark">
          <svg class="ico ico-15" aria-hidden="true"><use href="#i-moon"></use></svg>
        </button>
      </div>
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language">
        <span lang="zh">EN</span><span lang="en">中文</span>
      </button>
    </div>
  </div>
</header>
<main class="page-404">
  <div class="container">
    <div class="card-404">
      <p class="kicker-pill"><i class="pulse-dot" aria-hidden="true"></i><span class="mono">HTTP 404</span></p>
      <h1><span lang="zh">找不到这个页面。</span><span lang="en">Page not found.</span></h1>
      <p class="lead">
        <span lang="zh">请求的页面不存在，或者链接已变更。</span>
        <span lang="en">The page you requested does not exist or has moved.</span>
      </p>
      <div class="hero-ctas">
        <a class="btn-primary-panel" href="/">
          <span class="btn-panel-main btn-inline-ico"><svg class="ico ico-16" aria-hidden="true"><use href="#i-arrow-left"></use></svg><span lang="zh">回到 RokBot 首页</span><span lang="en">Back to RokBot Home</span></span>
          <i class="btn-led" aria-hidden="true"></i>
        </a>
        <a class="btn-outline" href="https://github.com/hongfaqiu/rokbot" rel="noopener">GitHub<svg class="ico ico-15" aria-hidden="true"><use href="#i-arrow-up-right"></use></svg></a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
